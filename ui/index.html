<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PathSnap</title>
<meta name="description" content="PathSnap map-matching evaluator">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M11 23V9h6.2a4.6 4.6 0 0 1 0 9.2H13' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="PathSnap">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#000"/><path d="M11 23V9h6.2a4.6 4.6 0 0 1 0 9.2H13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="wordmark">PathSnap</span>
    </a>
    <span class="topbar-divider" aria-hidden="true"></span>
    <div class="model-field">
      <label class="micro" for="model-select">MODEL</label>
      <select id="model-select" class="select" aria-label="Model" disabled>
        <option value="">&mdash;</option>
      </select>
    </div>
    <div class="topbar-right">
      <div class="conn" id="conn" role="status" aria-live="polite">
        <span class="conn-dot" id="conn-dot" aria-hidden="true"></span>
        <span class="conn-text" id="conn-text">CONNECTING</span>
      </div>
      <button id="settings-toggle" class="api-btn" type="button" aria-label="API settings" aria-expanded="false" aria-controls="settings">API</button>
      <div class="popover" id="settings" hidden>
        <div class="popover-head">
          <span class="micro">API ENDPOINT</span>
          <button id="settings-close" class="icon-btn icon-btn-sm" type="button" aria-label="Close settings">&times;</button>
        </div>
        <label class="field" for="api-base">
          <span class="micro">BASE URL</span>
          <input id="api-base" class="input mono" type="text" spellcheck="false" autocomplete="off" placeholder="http://localhost:8000">
        </label>
        <div class="popover-actions">
          <button id="api-apply" class="btn btn-primary" type="button">Apply</button>
          <button id="api-reset" class="btn btn-ghost" type="button">Reset</button>
        </div>
      </div>
    </div>
    <div class="progress" id="progress" hidden></div>
  </header>

  <main class="layout">
    <aside class="rail rail-left">
      <section>
        <div class="section-head">
          <span class="micro">TRIPS</span>
          <span class="micro count" id="trip-count">&mdash;</span>
        </div>
        <div class="trip-list" id="trip-list"></div>
        <p class="empty" id="trip-empty" hidden>No trips</p>
      </section>
      <section>
        <div class="section-head">
          <span class="micro">RECORDED</span>
          <span class="micro count" id="model-count">&mdash;</span>
        </div>
        <table class="models" id="models-table" hidden>
          <thead><tr><th>MODEL</th><th>CV F1</th><th>TEST</th><th>HMM</th></tr></thead>
          <tbody id="models-body"></tbody>
        </table>
        <p class="empty" id="models-empty">Model list unavailable</p>
      </section>
    </aside>

    <section class="map-wrap" aria-label="Map">
      <div id="map"></div>
      <div class="map-note" id="tile-note" hidden>Basemap offline</div>
    </section>

    <aside class="rail rail-right">
      <div class="result-head">
        <div class="section-head">
          <span class="micro">RESULTS</span>
          <span class="micro count" id="result-state">IDLE</span>
        </div>
        <div class="result-row">
          <span class="mono result-trip" id="result-trip">&mdash;</span>
          <span class="mono muted small" id="result-obs"></span>
        </div>
        <div class="result-row">
          <span class="micro">MODEL</span>
          <span class="mono small" id="result-model">&mdash;</span>
        </div>
      </div>

      <section class="panel" id="metrics-section" hidden>
        <div class="pair">
          <div>
            <span class="micro">TOP-1 / CLF</span>
            <span class="metric-lg mono" id="m-top1-clf">&mdash;</span>
          </div>
          <div>
            <span class="micro">TOP-1 / HMM</span>
            <span class="metric-lg mono" id="m-top1-hmm">&mdash;</span>
          </div>
        </div>
        <table class="metrics">
          <thead><tr><th></th><th>CLF</th><th>HMM</th></tr></thead>
          <tbody>
            <tr><th>CONTINUITY</th><td id="m-cont-clf">&mdash;</td><td id="m-cont-hmm">&mdash;</td></tr>
            <tr><th>SEQ F1</th><td id="m-seq-clf">&mdash;</td><td id="m-seq-hmm">&mdash;</td></tr>
          </tbody>
        </table>
      </section>

      <section class="panel" id="scoring-section" hidden>
        <table class="metrics metrics-single">
          <tbody>
            <tr><th>MACRO F1</th><td id="m-f1">&mdash;</td></tr>
            <tr><th>LOG LOSS</th><td id="m-logloss">&mdash;</td></tr>
            <tr><th>MISS</th><td id="m-miss">&mdash;</td></tr>
            <tr><th>SCORED</th><td id="m-scored">&mdash;</td></tr>
          </tbody>
        </table>
      </section>

      <section class="panel latency" id="latency-section" hidden>
        <div class="latency-head">
          <span class="micro">LATENCY</span>
          <span class="mono small" id="m-total">&mdash;</span>
        </div>
        <div class="latency-line mono muted" id="m-latency">&mdash;</div>
      </section>

      <p class="empty" id="result-empty">Select a trip</p>
    </aside>
  </main>

  <footer class="statusbar">
    <div class="status-left">
      <span class="mode-dot" id="mode-dot" aria-hidden="true"></span>
      <span id="mode-text">OFFLINE</span>
      <span class="status-sep" aria-hidden="true">&middot;</span>
      <span class="mono muted" id="partition-text">&mdash;</span>
    </div>
    <div class="status-right">
      <span id="train-text">&mdash;</span>
      <span class="status-sep" aria-hidden="true">&middot;</span>
      <span id="models-status">&mdash;</span>
      <span class="status-sep" aria-hidden="true">&middot;</span>
      <span class="mono muted" id="endpoint-text">&mdash;</span>
    </div>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
